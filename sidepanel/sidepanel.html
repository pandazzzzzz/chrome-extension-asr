<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASR</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <style>
    /* 侧栏宽度由面板容器决定，覆盖 popup 的固定 360px */
    body {
      width: auto;
      min-width: 260px;
    }
    /* 侧栏常驻：状态栏不清除，便于长会话观察 */
    #status {
      display: block;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <!--
    Side panel — 复用 popup/app.js 与 popup.css（DOM id 保持一致）。
    侧栏常驻不随点击关闭，适合长会话录音。
  -->
  <div class="container">
    <h1>ASR</h1>

    <label for="provider">Provider</label>
    <select id="provider"></select>

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">

    <div id="endpointRow" class="field">
      <label for="endpoint">Endpoint URL</label>
      <input id="endpoint" type="text" placeholder="https://...">
    </div>

    <div class="row">
      <div class="field">
        <label for="audioType">Audio format</label>
        <select id="audioType">
          <option value="audio/webm">webm</option>
          <option value="audio/mp4">mp4</option>
          <option value="audio/wav">wav</option>
        </select>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" value="">
      </div>
    </div>

    <div class="btn-row">
      <button id="recordBtn" class="primary">Start Recording</button>
      <button id="tabRecordBtn" class="secondary">Record Tab</button>
      <button id="saveBtn" class="secondary">Save audio</button>
      <button id="streamBtn" class="primary">Live Stream</button>
    </div>

    <label for="result">Result</label>
    <textarea id="result" rows="8" placeholder="Transcription will appear here..."></textarea>

    <div class="btn-row">
      <button id="copyBtn" class="ghost">Copy text</button>
      <button id="fillBtn" class="ghost">Fill into page</button>
      <button id="optionsBtn" class="ghost">Options</button>
    </div>
    <div id="status"></div>
  </div>

  <script src="../shared/errors.js"></script>
  <script src="../shared/timeout.js"></script>
  <script src="../messaging/messages.js"></script>
  <script src="../messaging/client.js"></script>
  <script src="../debug/bridge.js"></script>
  <script src="../store/crypto.js"></script>
  <script src="../store/config.js"></script>
  <script src="../store/history.js"></script>
  <script src="../audio/recorder.js"></script>
  <script src="../audio/convert.js"></script>
  <script src="../audio/pcm-capture.js"></script>
  <script src="../transcription/providers/base.js"></script>
  <script src="../transcription/providers/qwen.js"></script>
  <script src="../transcription/providers/index.js"></script>
  <script src="../popup/app.js"></script>
</body>
</html>
