# CodeQL — static security analysis.
#
# The extension has no build step (load-unpacked, plain JS/HTML/CSS), so
# `build-mode: none` is correct: CodeQL analyses the sources directly.
# Languages are detected as JavaScript (plus HTML/CSS, which CodeQL does not
# scan). `javascript-typescript` covers both .js and .ts.
#
# Findings appear under the repo's Security → Code scanning tab.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 01:30 UTC — catches new queries even without commits.
    - cron: '30 1 * * 1'

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Required to upload results to the code-scanning dashboard.
      security-events: write
      # Required to fetch CodeQL query packs.
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # Default query suite. Swap in `security-extended` for broader
          # coverage (more findings, more false positives) — this codebase
          # handles API keys and message passing across contexts, so the
          # extended suite is a reasonable upgrade later.
          # queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
