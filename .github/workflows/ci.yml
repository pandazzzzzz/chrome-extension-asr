# CI — syntax, manifest integrity, unit tests, packaging.
#
# The extension has no build step (load-unpacked), so there is nothing to
# compile; these are the checks that would otherwise be caught only by manually
# loading the unpacked directory.
#
# `npm test` covers the streaming provider contract and PCM helpers
# (tests/streaming.test.js). The browser smoke tests (tests/p1-smoke-test.html,
# 20 cases) need a real Chrome and are NOT run here yet — see the note at the
# bottom of this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Syntax, manifest, tests, pack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # package.json declares engines >=22.12.0 (puppeteer-core 25 requires it).
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all JavaScript
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check

      - name: Validate manifest.json and referenced paths
        run: node scripts/check-manifest.js

      - name: Unit tests
        run: npm test

      # Exercises the dependency-free node:zlib fallback used off-Windows.
      - name: Package the extension
        run: npm run pack

      - name: Upload extension.zip
        uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: extension.zip
          if-no-files-found: error

  # Commit messages are part of the project's public record, so they are linted
  # against docs/COMMIT_CONVENTION.md (via commitlint.config.mjs) — the same
  # rules the local .husky/commit-msg hook enforces. Without this, the convention
  # would only be checked on machines that ran `npm install`.
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A range needs history on both ends; the default shallow clone has neither.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a PR, lint exactly the commits it adds. github.event.pull_request.base.sha
      # is used rather than origin/<base_ref> because the base branch may have moved
      # on since the PR was opened.
      - name: Lint the commits in this pull request
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose

      # The PR title becomes the commit subject when the PR is squash-merged,
      # so it must satisfy the same rules. Passed via env to avoid shell interpolation.
      - name: Lint the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

      # On a direct push, lint what the push added. `before` is all zeros for a
      # brand-new branch, in which case there is no range to walk.
      - name: Lint the pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose

# Not covered here (deliberately):
#   - Browser smoke tests — they load real modules under file:// and need a
#     Chrome binary. ubuntu-latest ships google-chrome, so this is feasible via
#     puppeteer-core with an explicit executablePath, but it is not wired up yet.
#   - Live Stream / Record Tab end-to-end — needs a real DashScope API key and a
#     Chrome-for-Testing binary. Record Tab itself IS automatable
#     (page.triggerExtensionAction()); the blocker is the key, not the gesture.
#     Tracked in docs/HANDOFF.md §3.
