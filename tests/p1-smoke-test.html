<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASR Extension — P1 Smoke Tests</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 20px; max-width: 720px; }
  .case { margin: 12px 0; padding: 10px 14px; border-radius: 8px; }
  .pass { background: #e8f7ee; color: #1b6f3d; border-left: 4px solid #1b6f3d; }
  .fail { background: #fdecec; color: #8a2430; border-left: 4px solid #8a2430; }
  .name { font-weight: 600; }
  .detail { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  h2 { margin-top: 32px; }
  pre { background: #f3f4f6; padding: 10px; border-radius: 6px; overflow-x: auto; }
</style>
</head>
<body>
<h1>ASR Extension — P1 冒烟测试</h1>
<p>本页模拟扩展上下文，加载核心脚本并验证：加密/解密、provider 类、消息契约、错误规范化。</p>

<div id="results"></div>

<h2>Summary</h2>
<div id="summary"></div>

<!-- 加载扩展脚本（相对路径） -->
<script src="../shared/errors.js"></script>
<script src="../messaging/messages.js"></script>
<script src="../messaging/client.js"></script>
<script src="../store/crypto.js"></script>
<script src="../store/config.js"></script>
<script src="../popup/providers/base.js"></script>
<script src="../popup/providers/qwen.js"></script>
<script src="../popup/providers/openai.js"></script>
<script src="../popup/providers/deepgram.js"></script>
<script src="../popup/providers/index.js"></script>

<script>
const results = document.getElementById('results');
const summary = document.getElementById('summary');
let passed = 0, failed = 0;

function addResult(name, ok, detail) {
  const div = document.createElement('div');
  div.className = 'case ' + (ok ? 'pass' : 'fail');
  div.innerHTML = `<div class="name">${ok ? '✓' : '✗'} ${name}</div>` +
    (detail ? `<div class="detail">${detail}</div>` : '');
  results.appendChild(div);
  ok ? passed++ : failed++;
}

function finish() {
  summary.textContent = `${passed} passed, ${failed} failed (${passed + failed} total)`;
  summary.style.color = failed ? '#8a2430' : '#1b6f3d';
  summary.style.fontWeight = 'bold';
}

async function runTests() {
  // --- 1. CryptoStore: encrypt / decrypt roundtrip ---
  try {
    const plain = 'sk-test-abc123xyz';
    const enc = await globalThis.CryptoStore.encrypt(plain);
    const dec = await globalThis.CryptoStore.decrypt(enc);
    const ok = dec === plain && enc !== plain;
    addResult('CryptoStore: encrypt/decrypt roundtrip', ok,
      ok ? `plain="${plain.slice(0,12)}..." -> enc len=${enc.length} -> dec matches` :
      `dec="${dec}"`);
  } catch (e) {
    addResult('CryptoStore: encrypt/decrypt roundtrip', false, e.message);
  }

  // --- 2. CryptoStore: empty string roundtrip ---
  try {
    const r1 = await globalThis.CryptoStore.encrypt('');
    const r2 = await globalThis.CryptoStore.decrypt('');
    addResult('CryptoStore: empty string returns empty', r1 === '' && r2 === '',
      `encrypt("")="${r1}", decrypt("")="${r2}"`);
  } catch (e) {
    addResult('CryptoStore: empty string', false, e.message);
  }

  // --- 3. CryptoStore: decrypt wrong ciphertext ---
  try {
    await globalThis.CryptoStore.decrypt(btoa('not-valid-ciphertext'));
    addResult('CryptoStore: invalid ciphertext throws', false, 'should have thrown');
  } catch (e) {
    addResult('CryptoStore: invalid ciphertext throws', true, e.message.slice(0, 80));
  }

  // --- 4. ConfigStore: save / load roundtrip (mock storage) ---
  // 页面里没有 chrome.storage，但 ConfigStore 直接依赖它，所以我们只测
  // ConfigStore 是否在 globalThis 上正确挂载
  try {
    const ok = typeof globalThis.ConfigStore === 'object'
      && typeof globalThis.ConfigStore.load === 'function'
      && typeof globalThis.ConfigStore.save === 'function';
    addResult('ConfigStore: module loaded on globalThis', ok,
      ok ? 'ConfigStore.load/save functions available' : 'missing');
  } catch (e) {
    addResult('ConfigStore: module loaded', false, e.message);
  }

  // --- 5. Provider registry ---
  try {
    const p = globalThis.PROVIDERS || [];
    const ids = p.map(x => x.id).sort().join(',');
    const expected = ['deepgram', 'openai', 'qwen'];
    const ok = p.length === 3 && p.every(x =>
      typeof x.id === 'string' &&
      typeof x.name === 'string' &&
      typeof x.transcribe === 'function' &&
      typeof x.defaultModel === 'string');
    addResult('Providers: 3 registered, each with required API', ok,
      `ids=[${ids}], 3 providers, all have id/name/transcribe/defaultModel`);
  } catch (e) {
    addResult('Providers: registry', false, e.message);
  }

  // --- 6. BaseProvider: blobToDataUrl (no FileReader) ---
  try {
    const blob = new Blob(['hello world'], { type: 'text/plain' });
    const dataUrl = await globalThis.BaseProvider.blobToDataUrl(blob);
    const ok = typeof dataUrl === 'string' && dataUrl.startsWith('data:text/plain;base64,');
    // 反向解码验证内容
    const b64 = dataUrl.split(',')[1];
    const decoded = atob(b64);
    const contentOk = decoded === 'hello world';
    addResult('BaseProvider: blobToDataUrl works without FileReader', ok && contentOk,
      `length=${dataUrl.length}, decoded="${decoded}"`);
  } catch (e) {
    addResult('BaseProvider: blobToDataUrl', false, e.message);
  }

  // --- 7. BaseProvider: getAudioFormat ---
  try {
    const cases = [
      ['audio/webm', 'webm'],
      ['audio/mp4', 'mp4'],
      ['audio/wav', 'wav'],
      ['audio/wav; codecs=pcm', 'wav'],
      ['', 'webm'],
    ];
    const all = cases.every(([input, exp]) =>
      globalThis.BaseProvider.getAudioFormat(input) === exp);
    addResult('BaseProvider: getAudioFormat all cases', all,
      cases.map(([i, e]) => `${i}->${e}`).join(', '));
  } catch (e) {
    addResult('BaseProvider: getAudioFormat', false, e.message);
  }

  // --- 8. Messages: constants defined ---
  try {
    const m = globalThis.MESSAGES;
    const ok = m.TRANSCRIBE === 'asr:transcribe'
      && m.FILL_TEXT === 'asr:fill-text'
      && m.TRANSCRIBE_AND_FILL === 'asr:transcribe-and-fill'
      && Object.isFrozen(m);
    addResult('MESSAGES: constants defined and frozen', ok,
      `TRANSCRIBE="${m.TRANSCRIBE}", FILL_TEXT="${m.FILL_TEXT}"`);
  } catch (e) {
    addResult('MESSAGES: constants', false, e.message);
  }

  // --- 9. MessageClient: module loaded ---
  try {
    const ok = typeof globalThis.MessageClient === 'object'
      && typeof globalThis.MessageClient.send === 'function';
    addResult('MessageClient: module loaded on globalThis', ok,
      'MessageClient.send available (chrome.runtime not available in this page)');
  } catch (e) {
    addResult('MessageClient: module loaded', false, e.message);
  }

  // --- 10. Errors: unified codes + normalizeError ---
  try {
    const e = globalThis.Errors;
    const required = ['NO_PROVIDER', 'NO_API_KEY', 'NO_AUDIO',
      'API_ERROR', 'EMPTY_RESULT', 'UNKNOWN_ACTION', 'UNKNOWN'];
    const codesOk = required.every(k => e[k] && e[k].code === k && typeof e[k].message === 'string');
    const norm1 = globalThis.normalizeError({ code: 'NO_API_KEY', message: 'x' });
    const norm1Ok = norm1.code === 'NO_API_KEY';
    const norm2 = globalThis.normalizeError(new Error('boom'));
    const norm2Ok = norm2.code === 'API_ERROR' && norm2.message === 'boom';
    const allOk = codesOk && norm1Ok && norm2Ok;
    addResult('Errors: codes + normalizeError', allOk,
      `codes ok=${codesOk}, normalize(known)=${norm1Ok}, normalize(unknown)=${norm2Ok}`);
  } catch (e) {
    addResult('Errors: codes', false, e.message);
  }

  // --- 11. globalThis compatibility (providers on globalThis, not window) ---
  try {
    const ok = typeof globalThis.QwenProvider === 'function'
      && typeof globalThis.OpenAIProvider === 'function'
      && typeof globalThis.DeepgramProvider === 'function'
      && typeof globalThis.BaseProvider === 'function'
      && typeof globalThis.PROVIDERS === 'object';
    addResult('globalThis: all providers/modules on globalThis (SW-compatible)', ok,
      'Base/Qwen/OpenAI/Deepgram/PROVIDERS/ConfigStore/CryptoStore/MESSAGES/MessageClient/Errors all on globalThis');
  } catch (e) {
    addResult('globalThis: compat', false, e.message);
  }

  finish();
}

runTests();
</script>
</body>
</html>
