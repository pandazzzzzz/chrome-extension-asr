<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASR Demo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>ASR Demo</h1>

    <label for="provider">Provider</label>
    <select id="provider"></select>

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">

    <div class="field">
      <label for="region">Region</label>
      <select id="region"></select>
    </div>

    <div id="endpointRow" class="field">
      <label for="endpoint">Endpoint URL</label>
      <input id="endpoint" type="text" placeholder="wss://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference">
    </div>

    <div class="field" id="audioInputRow">
      <label for="audioInput">Microphone</label>
      <select id="audioInput"></select>
    </div>

    <div class="row">
      <div class="field">
        <label for="audioType">Audio format</label>
        <select id="audioType">
          <option value="audio/webm">webm</option>
          <option value="audio/mp4">mp4</option>
          <option value="audio/wav">wav</option>
        </select>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
    </div>

    <p class="hint">Need another model? Choose Custom... and enter its exact model name.</p>

    <div id="modelCustomRow" class="field">
      <label for="modelCustom">Model name</label>
      <input id="modelCustom" type="text" placeholder="e.g. fun-asr-realtime">
    </div>

    <div class="btn-row">
      <button id="testModelBtn" class="secondary">Test model</button>
    </div>

    <div class="btn-row">
      <button id="recordBtn" class="primary">Start Recording</button>
      <button id="tabRecordBtn" class="secondary">Record Tab</button>
      <button id="saveBtn" class="secondary">Save audio</button>
      <button id="streamBtn" class="primary">Live Stream</button>
    </div>

    <label for="result">Result</label>
    <textarea id="result" rows="6" placeholder="Live Stream transcripts appear here. Recording produces audio only."></textarea>

    <div class="btn-row">
      <button id="copyBtn" class="ghost">Copy text</button>
      <button id="fillBtn" class="ghost">Fill into page</button>
    </div>
    <div class="btn-row">
      <button id="subtitleBtn" class="ghost">Subtitles</button>
      <button id="optionsBtn" class="ghost">Options</button>
      <button id="panelBtn" class="ghost">Side panel</button>
    </div>
    <div id="status" role="status"></div>
  </div>

  <script src="../shared/errors.js"></script>
  <script src="../shared/timeout.js"></script>
  <script src="../shared/format.js"></script>
  <script src="../shared/config-ui.js"></script>
  <script src="../messaging/messages.js"></script>
  <script src="../messaging/client.js"></script>
  <script src="../debug/bridge.js"></script>
  <script src="../store/crypto.js"></script>
  <script src="../store/config.js"></script>
  <script src="../store/history.js"></script>
  <script src="../store/recordings.js"></script>
  <script src="../audio/recorder.js"></script>
  <script src="../audio/devices.js"></script>
  <script src="../transcription/providers/base.js"></script>
  <script src="../transcription/providers/qwen.js"></script>
  <script src="../transcription/providers/index.js"></script>
  <script src="app-state.js"></script>
  <script src="app-ui.js"></script>
  <script src="app-recording.js"></script>
  <script src="app-streaming.js"></script>
  <script src="app-actions.js"></script>
  <script src="app-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
